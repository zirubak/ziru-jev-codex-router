name: Windows advisory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-advisory-${{ github.ref }}
  cancel-in-progress: true

# Portability feedback only; never require this workflow for macOS releases.
# Preserve failures as failures so Windows diagnostics remain visible.
jobs:
  embedded-router-windows:
    name: Embedded router (windows-latest, advisory)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
